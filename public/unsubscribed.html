:root {
  --navy: #0F1729;
  --blue: #2563EB;
  --blue-hover: #1D4ED8;
  --white: #FFFFFF;
  --light: #F8FAFC;
  --gray-100: #F1F5F9;
  --gray-200: #E2E8F0;

  --muted: #64748B;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {

  color: var(--text);

a { color: var(--blue); text-decoration: none; }

.nav { position: sticky; top: 0; background: var(--navy); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 50; }
.nav-inner { max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.nav-btn { display: inline-block; background: transparent; color: rgba(255,255,255,0.88); border: 1px solid rgba(255,255,255,0.24); padding: 9px 18px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.15s ease, border-color 0.15s ease; white-space: nowrap; }
.nav-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.45); text-decoration: none; }
.nav-btn.primary { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
.nav-btn.primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); }

.hero { background: var(--light); padding: 60px 24px 40px; border-bottom: 1px solid var(--gray-200); }
.hero-inner { max-width: 800px; margin: 0 auto; }
.hero h1 { font-size: 44px; font-weight: 800; color: var(--navy); margin: 0 0 8px; letter-spacing: -0.03em; line-height: 1.1; }
.hero-meta { font-size: 14px; color: var(--muted); margin: 0; font-weight: 500; }

main { background: var(--white); }
.content { max-width: 800px; margin: 0 auto; padding: 56px 24px 72px; }
.content section { padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--gray-200); }
.content section:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.content h2 { font-size: 22px; font-weight: 700; color: var(--navy); margin: 0 0 14px; letter-spacing: -0.01em; }
.content h3 { font-size: 16px; font-weight: 600; color: var(--navy); margin: 18px 0 8px; letter-spacing: -0.005em; }
.content p { margin: 0 0 14px; }
.content ul { margin: 0 0 14px; padding-left: 22px; }
.content ul li { margin: 6px 0; }
.content .lead-in { font-weight: 500; color: var(--text); margin-bottom: 8px; }
.content .price-pill { display: inline-block; background: var(--gray-100); padding: 6px 14px; border-radius: 6px; font-weight: 600; color: var(--navy); margin: 4px 0; }

.footer { background: var(--navy); color: rgba(255,255,255,0.7); padding: 36px 24px; border-top: 1px solid rgba(255,255,255,0.06); }
.footer-inner { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; gap: 16px; font-size: 14px; }
.footer-left { color: rgba(255,255,255,0.85); font-weight: 600; }
.footer-center { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.footer-center a { color: rgba(255,255,255,0.7); }
.footer-center a:hover { color: var(--white); text-decoration: none; }
.footer-right { text-align: right; }
.footer-right a { color: rgba(255,255,255,0.7); }
.footer-right a:hover { color: var(--white); text-decoration: none; }

@media (max-width: 640px) {
  .nav-inner { padding: 12px 16px; }
  .nav-btn { padding: 8px 14px; font-size: 12px; }
  .hero { padding: 40px 18px 30px; }

  .content { padding: 40px 18px 56px; }
  .content h2 { font-size: 19px; }
  body { font-size: 15px; line-height: 1.75; }
  .footer-inner { grid-template-columns: 1fr; text-align: center; }
  .footer-center { justify-content: center; flex-wrap: wrap; gap: 14px; }
  .footer-right { text-align: center; }
