<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - GrowthIM</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0F1729;
  --blue: #2563EB;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --text: #1E293B;
  --muted: #64748B;
  --border: #E2E8F0;
  --danger: #DC2626;
  --danger-bg: #FEE2E2;
  --success: #065F46;
  --success-bg: #ECFDF5;
}
* { box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 420px; margin: 60px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 36px; box-shadow: 0 4px 16px rgba(15, 23, 41, 0.05); }
h1 { font-size: 24px; font-weight: 700; color: var(--navy); margin: 0 0 6px; letter-spacing: -0.02em; }
.meta { color: var(--muted); font-size: 14px; margin: 0 0 28px; line-height: 1.5; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.input-wrap { position: relative; }
input { width: 100%; padding: 11px 14px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.12s, box-shadow 0.12s; background: var(--surface); }
input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
input.pw { padding-right: 56px; }
.toggle { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); background: transparent; border: 0; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px; letter-spacing: 0.04em; }
.toggle:hover { color: var(--text); }
button.primary { width: 100%; margin-top: 8px; padding: 12px 14px; background: var(--navy); color: #FFFFFF; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.12s, opacity 0.12s; }
button.primary:hover { background: #1E293B; }
button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
.link-row { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
.link-row a { color: var(--blue); text-decoration: none; font-weight: 500; }
.link-row a:hover { text-decoration: underline; }
.link-row + .link-row { margin-top: 6px; }
.error { display: none; margin-top: 14px; padding: 10px 14px; background: var(--danger-bg); border: 1px solid #FECACA; color: #991B1B; border-radius: 8px; font-size: 13px; }
.error.show { display: block; }
.flash { display: none; margin-bottom: 18px; padding: 10px 14px; background: var(--success-bg); border: 1px solid #A7F3D0; color: var(--success); border-radius: 8px; font-size: 13px; }
.flash.show { display: block; }
/* Admin 2FA: screen toggle + OTP entry (reused from signup.html) */
.screen { display: none; }
.screen.active { display: block; }
.otp-input { letter-spacing: 12px; font-size: 22px; font-weight: 600; text-align: center; padding: 14px; }
.resend { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
.resend button { background: transparent; border: 0; color: var(--blue); font-weight: 500; cursor: pointer; font-family: inherit; font-size: 13px; padding: 0; }
.resend button:disabled { color: var(--muted); cursor: not-allowed; }
</style>
</head>
<body>

<!-- Already authenticated? Skip the form and go straight to the dashboard. -->
<script>
(function () {
  fetch('/auth/me', { credentials: 'same-origin' })
    .then(function (r) { if (r.ok) window.location.replace('/dashboard'); })
    .catch(function () {});
})();
</script>

<header style="background:#0F1729;padding:20px 0;text-align:center;border-bottom:1px solid rgba(255,255,255,0.06);">
  <a href="/" style="display:inline-block;text-decoration:none;">
    <div class="logo">
      <span style="color:#FFFFFF;font-size:22px;font-weight:700;letter-spacing:-0.5px;">
        Growth<span style="color:#2563EB">IM</span>
      </span>
      <div style="width:140px;height:2px;background:#2563EB;opacity:0.4;margin-top:2px;"></div>
      <div style="font-size:9px;font-weight:600;color:#64748B;letter-spacing:0.12em;margin-top:2px;">
        GROWTH INTELLIGENCE MACHINE
      </div>
    </div>
  </a>
</header>

<div class="wrap">
  <section id="screen-login" class="screen active">
  <div id="flash" class="flash"></div>
  <h1>Welcome back</h1>
  <p class="meta">Sign in to access your GrowthIM reports.</p>
  <form id="login-form" autocomplete="off" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input id="password" name="password" type="password" class="pw" required autocomplete="current-password">
        <button type="button" class="toggle" data-target="password">SHOW</button>
      </div>
    </div>
    <button id="submit-btn" class="primary" type="submit">Login</button>
    <div id="form-error" class="error"></div>
  </form>
  <p class="link-row"><a href="/forgot.html">Forgot password?</a></p>
  <p class="link-row">No account? <a href="/signup.html">Sign up</a></p>
  </section>

  <!-- ─────── Admin 2FA: OTP entry — shown ONLY when the server returns otpRequired ─────── -->
  <section id="screen-otp" class="screen">
    <h1>Enter your login code</h1>
    <p class="meta">For security, we emailed a 6-digit code to <span id="otp-email">your email</span>. Enter it to finish signing in.</p>
    <form id="otp-form" autocomplete="off" novalidate>
      <div class="field">
        <label for="otp">Verification code</label>
        <input id="otp" name="otp" type="text" class="otp-input" inputmode="numeric" maxlength="6" pattern="\d{6}" required>
      </div>
      <button id="verify-btn" class="primary" type="submit">Verify &amp; sign in</button>
      <div id="otp-error" class="error"></div>
    </form>
    <div class="resend">
      Didn't receive it? <button id="resend-btn" type="button" disabled>Resend code in 60s</button>
    </div>
  </section>
</div>

<p style="text-align:center;font-size:12px;color:#94A3B8;margin:24px auto 8px;font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;">
  <a href="/privacy" style="color:#94A3B8;text-decoration:none;">Privacy Policy</a>
  &nbsp;·&nbsp;
  <a href="/terms" style="color:#94A3B8;text-decoration:none;">Terms of Service</a>
</p>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  function showError(msg) {
    const box = $('form-error');
    box.textContent = msg;
    box.classList.add('show');
  }
  function hideError() {
    $('form-error').classList.remove('show');
  }
  function validEmail(e) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  // ── Admin 2FA state + helpers ──
  // Credentials stay in JS memory between the login submit and OTP
  // verification so Resend can re-call /auth/login. Only ever populated
  // for the admin account (server returns otpRequired); wiped on success.
  let pendingEmail = '';
  let pendingPassword = '';
  let resendInterval = null;
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }
  function showOtpError(msg) {
    const b = $('otp-error');
    b.textContent = msg;
    b.classList.add('show');
  }
  function hideOtpError() {
    $('otp-error').classList.remove('show');
  }
  function startResendCountdown() {
    const btn = $('resend-btn');
    btn.disabled = true;
    let s = 60;
    btn.textContent = `Resend code in ${s}s`;
    clearInterval(resendInterval);
    resendInterval = setInterval(() => {
      s -= 1;
      if (s <= 0) {
        clearInterval(resendInterval);
        btn.disabled = false;
        btn.textContent = 'Resend code';
      } else {
        btn.textContent = `Resend code in ${s}s`;
      }
    }, 1000);
  }

  // Password show/hide toggle.
  document.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = $(btn.dataset.target);
      const isPw = inp.type === 'password';
      inp.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? 'HIDE' : 'SHOW';
    });
  });

  // Flash message from query string (?msg=...) - used after a
  // password reset success redirect from forgot.html.
  (function showFlash() {
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('msg');
    if (msg) {
      const box = $('flash');
      box.textContent = msg;
      box.classList.add('show');
    }
  })();

  $('login-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    hideError();
    const email = $('email').value.trim();
    const password = $('password').value;
    if (!email || !password) return showError('Email and password are required.');
    if (!validEmail(email)) return showError('Please enter a valid email address.');

    const submitBtn = $('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const json = await res.json();
      if (!res.ok || !json.success) {
        showError(json.error || 'Login failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
        return;
      }
      // Admin account → server withholds the session and asks for an emailed
      // OTP. Regular users have no otpRequired flag and fall straight through
      // to the dashboard exactly as before.
      if (json.otpRequired) {
        pendingEmail = email;
        pendingPassword = password;
        $('otp-email').textContent = json.email || email;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
        showScreen('screen-otp');
        startResendCountdown();
        setTimeout(() => $('otp').focus(), 50);
        return;
      }
      window.location.href = '/dashboard';
    } catch (e) {
      showError('Network error. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Login';
    }
  });

  // ── Admin 2FA: OTP submit → verify; the session cookie is set server-side ──
  $('otp-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    hideOtpError();
    const otp = $('otp').value.trim();
    if (!/^\d{6}$/.test(otp)) return showOtpError('Enter the 6-digit code.');
    const verifyBtn = $('verify-btn');
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Verifying...';
    try {
      const res = await fetch('/auth/verify-login-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, otp }),
      });
      const json = await res.json();
      if (!res.ok || !json.success) {
        showOtpError(json.error || 'Incorrect code, try again.');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & sign in';
        return;
      }
      pendingEmail = '';
      pendingPassword = '';
      window.location.href = '/dashboard';
    } catch (e) {
      showOtpError('Network error. Please try again.');
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verify & sign in';
    }
  });

  // ── Admin 2FA: Resend — re-calls /auth/login with the in-memory creds,
  // which re-validates the password and issues a fresh code (resetting the
  // attempt counter). Mirrors signup.html's resend pattern. ──
  $('resend-btn').addEventListener('click', async () => {
    if (!pendingEmail || !pendingPassword) {
      showOtpError('Session expired. Please sign in again.');
      return;
    }
    hideOtpError();
    const btn = $('resend-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, password: pendingPassword }),
      });
      const json = await res.json();
      if (!res.ok || !json.success) {
        showOtpError(json.error || 'Could not resend code.');
        btn.disabled = false;
        btn.textContent = 'Resend code';
        return;
      }
      startResendCountdown();
    } catch (e) {
      showOtpError('Network error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Resend code';
    }
  });
})();
</script>
</body>
</html>
